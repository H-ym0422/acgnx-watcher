name: 加番

# 手机也能用：GitHub App / 手机浏览器 -> 仓库 Actions -> 加番 -> Run workflow
# 输入番名 -> 云端自动搜索、认译名、选字幕组、写规则、推代码
# -> 然后飞书收到「已加入监听 XXX」+ 最新一集的磁力

on:
  workflow_dispatch:
    inputs:
      anime:
        description: "番名（填 2~4 个最有辨识度的字，例如：咒术回战）"
        required: true
        type: string
      group:
        description: "字幕组（多个用逗号分隔；留空 = 自动选发布最多的前 2 个）"
        required: false
        type: string
        default: ""
      any_group:
        description: "任意字幕组都推（勾上就忽略上面的字幕组）"
        required: false
        type: boolean
        default: false
      backfill:
        description: "加完后推哪些 → all=第1集到最新集全给（默认）；latest=只给最新一集；none=都不推"
        required: false
        type: choice
        default: all
        options:
          - all
          - latest
          - none

permissions:
  contents: write

concurrency:
  group: acgnx-add-rule
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 加规则
        env:
          ACGNX_WEBHOOK_URL: ${{ secrets.ACGNX_WEBHOOK_URL }}
          ACGNX_DINGTALK_SECRET: ${{ secrets.ACGNX_DINGTALK_SECRET }}
          ACGNX_FEISHU_SECRET: ${{ secrets.ACGNX_FEISHU_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          ANIME: ${{ inputs.anime }}
          GROUP: ${{ inputs.group }}
          ANYGROUP: ${{ inputs.any_group }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          set -e
          echo "番名  : $ANIME"
          echo "字幕组: ${GROUP:-（自动选）}"
          echo "任意组: $ANYGROUP"
          echo "推送范围: ${BACKFILL:-all}"
          echo "----------------------------------------"

          ARGS=("$ANIME" --yes --no-push --notify --backfill "${BACKFILL:-all}")

          if [ "$ANYGROUP" = "true" ]; then
            ARGS+=(--any-group)
          elif [ -n "$GROUP" ]; then
            IFS=',' read -ra G <<< "$GROUP"
            for g in "${G[@]}"; do
              g="$(echo "$g" | xargs)"          # 去掉两端空格
              [ -n "$g" ] && ARGS+=(--group "$g")
            done
          else
            ARGS+=(--auto-group)
          fi

          python add_rule.py "${ARGS[@]}"

      - name: 提交并推送
        env:
          ANIME: ${{ inputs.anime }}
        run: |
          git config user.name  "acgnx-bot"
          git config user.email "acgnx-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain config.json state.json "我的番剧.md")" ]; then
            git add config.json state.json "我的番剧.md"
            git commit -m "加番：$ANIME [skip ci]"
            git push
            echo "已提交并推送"
          else
            echo "没有变化（这部番可能没搜到）"
          fi
