name: 加番

# 电脑上用的入口：仓库 -> Actions -> 加番 -> Run workflow
#
# 两种走法：
#   1. 填了「字幕组」或勾了「任意字幕组」-> 直接加，一步到位
#   2. 什么都没填 -> 不替你瞎选，而是自动开一个标题为「加番 XXX」的 Issue，
#      在那条 Issue 里列出所有在做这部番的字幕组和各自的字幕形式，
#      你在 Issue 里回复序号（或组名）才真正加。
#      （跟「发 Issue 加番」是同一条流程）

on:
  workflow_dispatch:
    inputs:
      anime:
        description: "番名（2~4 个最有辨识度的字，例如：咒术回战）"
        required: true
        type: string
      group:
        description: "字幕组（多个用逗号分隔）。留空 = 不替你选，改成开 Issue 让你挑"
        required: false
        type: string
        default: ""
      any_group:
        description: "任意字幕组都推（勾上就忽略上面的字幕组，直接加）"
        required: false
        type: boolean
        default: false
      backfill:
        description: "加完后推哪些 → all=第1集到最新集全给（默认）；latest=只给最新一集；none=都不推"
        required: false
        type: choice
        default: all
        options:
          - all
          - latest
          - none

permissions:
  contents: write
  issues: write

concurrency:
  group: acgnx-add-rule
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 判断走哪条路
        id: decide
        env:
          ANIME: ${{ inputs.anime }}
          GROUP: ${{ inputs.group }}
          ANYGROUP: ${{ inputs.any_group }}
        run: |
          GRP_CLEAN="$(printf '%s' "$GROUP" | tr -d '[:space:]')"
          echo "番名      : $ANIME"
          echo "字幕组    : ${GRP_CLEAN:-（留空）}"
          echo "任意字幕组: $ANYGROUP"
          if [ "$ANYGROUP" = "true" ] || [ -n "$GRP_CLEAN" ]; then
            echo "path=direct" >> "$GITHUB_OUTPUT"
            echo "-- 已指定字幕组，直接加"
          else
            echo "path=ask" >> "$GITHUB_OUTPUT"
            echo "-- 没指定字幕组，改成开一条 Issue 让你挑"
          fi

      - name: 加规则并推送
        if: steps.decide.outputs.path == 'direct'
        env:
          ANIME: ${{ inputs.anime }}
          GROUP: ${{ inputs.group }}
          ANYGROUP: ${{ inputs.any_group }}
          BACKFILL: ${{ inputs.backfill }}
          ACGNX_WEBHOOK_URL: ${{ secrets.ACGNX_WEBHOOK_URL }}
          ACGNX_DINGTALK_SECRET: ${{ secrets.ACGNX_DINGTALK_SECRET }}
          ACGNX_FEISHU_SECRET: ${{ secrets.ACGNX_FEISHU_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          set -e
          echo "推送范围: ${BACKFILL:-all}"
          echo "----------------------------------------"
          ARGS=("$ANIME" --yes --no-push --notify --backfill "${BACKFILL:-all}")
          if [ "$ANYGROUP" = "true" ]; then
            ARGS+=(--any-group)
          else
            IFS=',' read -ra G <<< "$GROUP"
            for g in "${G[@]}"; do
              g="$(printf '%s' "$g" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -n "$g" ] && ARGS+=(--group "$g")
            done
          fi
          python add_rule.py "${ARGS[@]}"

          git config user.name  "acgnx-bot"
          git config user.email "acgnx-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain config.json state.json "我的番剧.md")" ]; then
            git add config.json state.json "我的番剧.md"
            git commit -m "加番：$ANIME [skip ci]"
            git push
            echo "已提交并推送"
          else
            echo "没有变化（这部番可能没搜到）"
          fi

      - name: 开一条 Issue 让用户挑字幕组
        if: steps.decide.outputs.path == 'ask'
        env:
          ANIME: ${{ inputs.anime }}
        uses: actions/github-script@v7
        with:
          script: |
            const anime = (process.env.ANIME || '').trim();
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `加番 ${anime}`,
              body: [
                '这条 Issue 是 Actions 页面的「加番」入口自动开的 ——',
                '因为那里没有填字幕组。',
                '',
                '马上会有机器人回复一份「有哪些字幕组在做、各自是什么字幕形式」的清单，',
                '在下面回复序号或者组名就加上了。'
              ].join('\n')
            });
            console.log(`已创建 Issue #${issue.number} -> ${issue.html_url}`);
            await core.summary
              .addHeading('已交给你挑字幕组', 3)
              .addRaw('没有指定字幕组，所以没有替你瞎选。')
              .addEOL()
              .addRaw(`已开 Issue **#${issue.number}**：${issue.html_url}`)
              .addEOL()
              .addRaw('打开它就能看到清单，回复序号即可。')
              .write();
            core.notice(`已创建 Issue #${issue.number}：${issue.html_url}`);
