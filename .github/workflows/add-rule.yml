name: 加番

# 电脑上用的入口：仓库 -> Actions -> 加番 -> Run workflow
#
# 两种走法：
#   1. 填了「字幕组」或勾了「任意字幕组」-> 直接加，一步到位
#   2. 什么都没填 -> 不替你瞎选，而是自动开一个标题为「加番 XXX」的 Issue，
#      在那条 Issue 里列出所有在做这部番的字幕组和各自的字幕形式，
#      你在 Issue 里回复序号（或组名）才真正加。
#      （跟「发 Issue 加番」是同一条流程）

on:
  workflow_dispatch:
    inputs:
      anime:
        description: "番名（2~4 个最有辨识度的字，例如：咒术回战）"
        required: true
        type: string
      group:
        description: "字幕组（多个用逗号分隔）。留空 = 不替你选，改成开 Issue 让你挑"
        required: false
        type: string
        default: ""
      any_group:
        description: "任意字幕组都推（勾上就忽略上面的字幕组，直接加）"
        required: false
        type: boolean
        default: false
      season:
        description: "第几季（多季番只想看某一季时填数字，比如 1）。留空 = 不限季"
        required: false
        type: string
        default: ""
      from_episode:
        description: "只要第几集之后（本地已有前面几集就填，比如 49）。留空 = 从第 1 集开始"
        required: false
        type: string
        default: ""
      backfill:
        description: "加完后推哪些 → all=第1集到最新集全给（默认）；latest=只给最新一集；none=都不推"
        required: false
        type: choice
        default: all
        options:
          - all
          - latest
          - none

permissions:
  contents: write
  issues: write

concurrency:
  group: acgnx-state-writer
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 判断走哪条路
        id: decide
        env:
          ANIME: ${{ inputs.anime }}
          GROUP: ${{ inputs.group }}
          ANYGROUP: ${{ inputs.any_group }}
          SEA: ${{ inputs.season }}
          FROM_EP: ${{ inputs.from_episode }}
        run: |
          GRP_CLEAN="$(printf '%s' "$GROUP" | tr -d '[:space:]')"
          SEA_CLEAN="$(printf '%s' "$SEA" | tr -d '[:space:]')"
          case "$SEA_CLEAN" in ''|*[!0-9]*) SEA_CLEAN="" ;; esac
          echo "番名      : $ANIME"
          echo "字幕组    : ${GRP_CLEAN:-（留空）}"
          echo "任意字幕组: $ANYGROUP"
          echo "第几季    : ${SEA_CLEAN:-（不限）}"
          if [ "$ANYGROUP" = "true" ] || [ -n "$GRP_CLEAN" ]; then
            echo "path=direct" >> "$GITHUB_OUTPUT"
            echo "-- 已指定字幕组，直接加"
          else
            echo "path=ask" >> "$GITHUB_OUTPUT"
            echo "-- 没指定字幕组，改成开一条 Issue 让你挑"
          fi
          echo "sea=$SEA_CLEAN" >> "$GITHUB_OUTPUT"

      - name: 加规则并推送
        if: steps.decide.outputs.path == 'direct'
        env:
          ANIME: ${{ inputs.anime }}
          GROUP: ${{ inputs.group }}
          ANYGROUP: ${{ inputs.any_group }}
          BACKFILL: ${{ inputs.backfill }}
          FROM_EP: ${{ inputs.from_episode }}
          SEA: ${{ steps.decide.outputs.sea }}
          ACGNX_REMOTE_CHECKPOINT: "1"
          ACGNX_REQUEST_BUDGET_SECONDS: "120"
          ACGNX_WEBHOOK_URL: ${{ secrets.ACGNX_WEBHOOK_URL }}
          ACGNX_DINGTALK_SECRET: ${{ secrets.ACGNX_DINGTALK_SECRET }}
          ACGNX_FEISHU_SECRET: ${{ secrets.ACGNX_FEISHU_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          set -e
          echo "推送范围: ${BACKFILL:-all}"
          echo "----------------------------------------"
          ARGS=("$ANIME" --yes --no-push --notify --backfill "${BACKFILL:-all}")
          [ -n "$SEA" ] && ARGS+=(--season "$SEA")
          [ -n "$FROM_EP" ] && ARGS+=(--from-episode "$FROM_EP")
          if [ "$ANYGROUP" = "true" ]; then
            ARGS+=(--any-group)
          else
            IFS=',' read -ra G <<< "$GROUP"
            for g in "${G[@]}"; do
              g="$(printf '%s' "$g" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -n "$g" ] && ARGS+=(--group "$g")
            done
          fi
          python add_rule.py "${ARGS[@]}"

          git config user.name  "acgnx-bot"
          git config user.email "acgnx-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain config.json state.json state.backup.json "我的番剧.md")" ]; then
            git add config.json state.json "我的番剧.md"
            if [ -f state.backup.json ]; then git add state.backup.json; fi
            git commit -m "加番：$ANIME [skip ci]"
            # ⚠️ 必须 rebase 后再推：每 5 分钟的 watcher 也会往 main 提交「更新进度」，
            #    直接 push 会 non-fast-forward 失败 —— 而失败意味着**规则没存进仓库**，
            #    但飞书通知已经发出去了，看着像成功了（2026-10-17 实测踩到）
            git push 2>/dev/null || {
              echo "首次推送被拒（可能有并发提交），rebase 后重试…"
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
              git push
            }
            git fetch origin "${GITHUB_REF_NAME:-main}" -q
            if git diff --quiet HEAD "origin/${GITHUB_REF_NAME:-main}" -- config.json state.json "我的番剧.md"; then
              :
            else
              echo "⚠️⚠️ 提交没能推上去，规则可能没存进仓库 —— 请重发一次同样的 Issue"
              echo "PUSH_FAILED=1" >> "$GITHUB_ENV"
            fi
          else
            echo "没有变化（这部番可能没搜到）"
          fi

      - name: 抓一份字幕组清单
        id: survey
        if: steps.decide.outputs.path == 'ask'
        env:
          ANIME: ${{ inputs.anime }}
          SEA: ${{ steps.decide.outputs.sea }}
        run: |
          if [ -n "$SEA" ]; then
            OUT="$(python add_rule.py --survey "$ANIME" --season "$SEA" --snapshot-out .survey-snapshot.json 2>&1)"
          else
            OUT="$(python add_rule.py --survey "$ANIME" --snapshot-out .survey-snapshot.json 2>&1)"
          fi
          [ -z "$OUT" ] && OUT="没搜到「$ANIME」。试试日文原名、罗马音，或者只取其中 2~4 个字。"
          echo "$OUT"
          {
            echo "SURVEY<<ACGNX_EOF"
            printf '%s\n' "$OUT" | tail -c 8000
            echo "ACGNX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 开一条 Issue 并贴上清单
        if: steps.decide.outputs.path == 'ask'
        env:
          ANIME: ${{ inputs.anime }}
          SURVEY: ${{ steps.survey.outputs.SURVEY }}
          SEA: ${{ steps.decide.outputs.sea }}
          FROM_EP: ${{ inputs.from_episode }}
          BACKFILL: ${{ inputs.backfill }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const anime = (process.env.ANIME || '').trim();
            const survey = (process.env.SURVEY || '(没有输出)').slice(0, 8000);
            const marker = fs.existsSync('.survey-snapshot.json')
              ? '<!-- acgnx-survey:v1:' + Buffer.from(fs.readFileSync('.survey-snapshot.json', 'utf8')).toString('base64url') + ' -->'
              : '';

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `加番 ${anime}`,
              body: [
                '这条 Issue 是 Actions 页面的「加番」入口自动开的 ——',
                '因为那里没有填字幕组，所以没有替你瞎选。',
                '',
                '清单见下面第一条评论。',
                '',
                '### 第几季',
                process.env.SEA || '',
                '',
                '### 只要第几集之后',
                process.env.FROM_EP || '',
                '',
                '### 推哪些',
                process.env.BACKFILL || 'all'
              ].join('\n')
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                '```',
                survey,
                '```',
                '',
                '**看清楚后在下面回复序号（如 `2` 或 `1,3`）或者直接写组名，我就加上。**',
                '回复 `任意` 就是不挑组。回复“刷新”重新获取清单。',
                marker
              ].join('\n')
            });

            console.log(`已创建 Issue #${issue.number} -> ${issue.html_url}`);
            await core.summary
              .addHeading('没填字幕组，已开一条 Issue 让你挑', 3)
              .addRaw(`Issue **#${issue.number}**：${issue.html_url}`)
              .addEOL()
              .addRaw('打开它能看到完整的字幕组清单，回复序号即可。')
              .addEOL()
              .addRaw('（规则**还没有**加，等你回复。）')
              .write();
            core.notice(`Issue #${issue.number} 已创建：${issue.html_url}`);

