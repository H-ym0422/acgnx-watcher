name: Validate
on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.py', '.github/workflows/**', 'requirements-dev.txt']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -c "import acgnx_watch as w; w.load_config(); w.load_state(); print('config/state readable')"
      - run: python check_workflows.py --require-bash
      - run: python -m unittest discover -s tests -v
