name: 加番（发 Issue）

# 手机最好用的入口：新建一个 Issue，标题写
#     加番 咒术回战
# 想删掉某部番就写
#     删番 咒术回战
#
# 正文（可选）第一行可以填字幕组，多个用逗号分隔：
#     绿茶字幕组,喵萌奶茶屋
# 不填 = 自动选发布最多的前 2 个组。
#
# 跑完机器人会在 Issue 里回一条评论（含结果和磁力），飞书也会收到通知。

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: acgnx-issue-rule
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    if: >
      startsWith(github.event.issue.title, '加番') ||
      startsWith(github.event.issue.title, '删番') ||
      startsWith(github.event.issue.title, '列表') ||
      startsWith(github.event.issue.title, '我的番')
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解析并执行
        id: handle
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          ACGNX_WEBHOOK_URL: ${{ secrets.ACGNX_WEBHOOK_URL }}
          ACGNX_DINGTALK_SECRET: ${{ secrets.ACGNX_DINGTALK_SECRET }}
          ACGNX_FEISHU_SECRET: ${{ secrets.ACGNX_FEISHU_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [[ "$TITLE" == 加番* ]]; then
            MODE=add; KW="${TITLE#加番}"
          elif [[ "$TITLE" == 删番* ]]; then
            MODE=del; KW="${TITLE#删番}"
          elif [[ "$TITLE" == 列表* || "$TITLE" == 我的番* ]]; then
            MODE=list; KW=""
          else
            echo "标题不是「加番」「删番」或「列表」开头，跳过。"
            echo "RESULT=标题不是「加番」「删番」或「列表」开头，跳过。" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KW="$(echo "$KW" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          echo "MODE=$MODE" >> "$GITHUB_OUTPUT"

          # 正文第一行非空内容 = 字幕组（可选）
          GRP="$(printf '%s\n' "$BODY" | grep -v '^[[:space:]]*$' | head -1 | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' || true)"
          case "$GRP" in 字幕组*|"#"*|"- "*|*"填写"*) GRP="";; esac

          echo "======================================"
          echo "模式  : $MODE"
          echo "关键词: $KW"
          echo "字幕组: ${GRP:-（自动选前 2 个）}"
          echo "======================================"

          if [[ "$MODE" == list ]]; then
            OUT="$(python add_rule.py --render --no-push 2>&1 || true)"
          elif [[ -z "$KW" ]]; then
            OUT="标题里没写番名。正确写法：加番 咒术回战"
          elif [[ "$MODE" == del ]]; then
            OUT="$(python add_rule.py --del-name "$KW" --no-push 2>&1 || true)"
          else
            ARGS=("$KW" --yes --no-push --notify --backfill all)
            if [[ -n "$GRP" ]]; then
              IFS=',' read -ra G <<< "$GRP"
              for g in "${G[@]}"; do
                g="$(echo "$g" | xargs)"
                [[ -n "$g" ]] && ARGS+=(--group "$g")
              done
            else
              ARGS+=(--auto-group)
            fi
            OUT="$(python add_rule.py "${ARGS[@]}" 2>&1 || true)"
          fi

          echo "$OUT"
          {
            echo "RESULT<<ACGNX_EOF"
            printf '%s\n' "$OUT" | tail -c 3000
            echo "ACGNX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 提交并推送
        run: |
          git config user.name  "acgnx-bot"
          git config user.email "acgnx-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain config.json state.json "我的番剧.md")" ]; then
            git add config.json state.json "我的番剧.md"
            git commit -m "${{ github.event.issue.title }} [skip ci]"
            git push
            echo "已提交并推送"
          else
            echo "config.json / state.json / 我的番剧.md 没有变化"
          fi

      - name: 在 Issue 里回复结果
        if: always()
        env:
          OUT: ${{ steps.handle.outputs.RESULT }}
          JOBSTATUS: ${{ job.status }}
          HANDLEMODE: ${{ steps.handle.outputs.MODE }}
          CMD: ${{ github.event.issue.title }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = process.env.JOBSTATUS === 'success';
            const mode = process.env.HANDLEMODE || '';
            const out = (process.env.OUT || '(没有输出)').slice(0, 3000);
            let tail;
            if (mode === 'list') {
              tail = '上面就是你当前在追的全部番剧。';
            } else if (ok) {
              tail = '云端最多 5 分钟后就会开始盯这部番。新集一出来就会推到你手机。';
            } else {
              tail = '把 `Actions` 里这次运行的日志发我看看。';
            }
            const body = [
              ok ? '✅ **处理完成**' : '❌ **处理失败**',
              '',
              '```',
              out,
              '```',
              '',
              tail
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
