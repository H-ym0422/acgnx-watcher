name: 加番（发 Issue）
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: acgnx-state-writer
  cancel-in-progress: false
jobs:
  handle:
    runs-on: ubuntu-latest
    if: >
      github.actor == github.repository_owner &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || github.event.comment.user.type != 'Bot')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解析并执行
        id: handle
        env:
          GH_TOKEN: ${{ github.token }}
          ACGNX_WEBHOOK_URL: ${{ secrets.ACGNX_WEBHOOK_URL }}
          ACGNX_DINGTALK_SECRET: ${{ secrets.ACGNX_DINGTALK_SECRET }}
          ACGNX_FEISHU_SECRET: ${{ secrets.ACGNX_FEISHU_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python issue_commands.py
      - name: 提交并推送
        id: persist
        if: ${{ !cancelled() && steps.handle.outcome != 'skipped' }}
        env:
          I_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name acgnx-bot
          git config user.email acgnx-bot@users.noreply.github.com
          if [ -n "$(git status --porcelain config.json state.json state.backup.json "我的番剧.md")" ]; then
            git add config.json state.json "我的番剧.md"
            if [ -f state.backup.json ]; then git add state.backup.json; fi
            git commit -m "$I_TITLE [skip ci]"
            git push || {
              git pull --rebase origin main
              git push
            }
          fi
      - name: 回复 Issue
        if: always()
        env:
          PERSIST_OK: ${{ steps.persist.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = {ok: false, text: '处理步骤未完成，请检查 Actions 日志。'};
            if (fs.existsSync('.issue-result.json')) {
              result = JSON.parse(fs.readFileSync('.issue-result.json', 'utf8'));
            }
            const saved = process.env.PERSIST_OK === 'true';
            const ok = result.ok && saved;
            const content = String(result.text || '(无输出)').slice(-12000).replace(/```/g, '~~~');
            const tail = !saved
              ? '仓库保存失败，请检查运行日志后重试；通知可能已发送。'
              : result.step === 'survey'
                ? '请按本条清单回复序号或组名；回复“刷新”重新获取清单。'
                : result.ok
                  ? '请以上方输出确认规则保存与通知送达状态；待重试通知会由定时任务补发。'
                  : '未能完整执行，请按上方错误提示处理。';
            const body = [ok ? '✅ 处理完成' : '❌ 处理未完成', '', '```', content, '```', tail,
              saved ? result.marker || '' : ''].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
