 药师少女"},{"number":4,"id":"I_kwDOVL_yQM8AAAABXpyd-Q","title":"（已关闭·测试）加番 药师少女"},{"number":3,"id":"I_kwDOVL_yQM8AAAABXpXPsQ","title":"（已关闭·测试）两步加番验证"},{"number":2,"id":"I_kwDOVL_yQM8AAAABXo9CYg","title":"（已关闭）列表功能测试"},{"number":1,"id":"I_kwDOVL_yQM8AAAABXo2tdw","title":"（已关闭·测试）加番功能验证"}];
            const existing = [];
            for (const target of targets) {
              try {
                const {data} = await github.rest.issues.get({...context.repo, issue_number: target.number});
                if (data.pull_request || data.node_id !== target.id || data.title !== target.title) throw new Error('Issue snapshot changed: ' + target.number);
                existing.push(target);
              } catch (error) {
                if (error.status !== 404 && error.status !== 410) throw error;
              }
            }
            const listed = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'all', per_page: 100});
            for (const [id, name] of expected) {
              const marker = '<!-- acgnx-active-rule:' + id + ' -->';
              if (!listed.some(i => !i.pull_request && i.state === 'open' && i.body?.includes(marker))) {
                await github.rest.issues.create({...context.repo, title: '追番｜' + name, body: marker + '\n\n当前正在追番。订阅、字幕组和删除入口以仓库《我的番剧》文档为准。\n\n[打开我的番剧](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/我的番剧.md)'});
              }
            }
            for (const target of existing) {
              const result = await ownerGithub.graphql('mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { clientMutationId } }', {id: target.id});
              if (!result?.deleteIssue) throw new Error('Deletion not confirmed: ' + target.number);
              console.log('Permanently removed #' + target.number);
            }
            const remaining = (await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'all', per_page: 100})).filter(i => !i.pull_request);
            if (remaining.some(i => targets.some(t => t.id === i.node_id))) throw new Error('Historical issues remain');
            console.log('Remaining issue count: ' + remaining.length);
            await core.summary.addRaw('Removed historical operation records. Remaining issues: ' + remaining.map(i => '#' + i.number + ' ' + i.title).join(', ')).write();
