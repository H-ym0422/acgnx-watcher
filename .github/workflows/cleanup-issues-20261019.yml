name: 清理历史 Issue（2026-10-19）
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-issues-20261019.yml]
permissions:
  contents: read
  issues: write
concurrency:
  group: acgnx-state-writer
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'H-ym0422/acgnx-watcher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env:
          ISSUE_DELETE_TOKEN: ${{ secrets.ACGNX_ISSUE_DELETE_TOKEN }}
        with:
          script: |
            const token = process.env.ISSUE_DELETE_TOKEN;
            if (!token) throw new Error('Missing ACGNX_ISSUE_DELETE_TOKEN');
            const ownerGithub = new github.constructor({auth: token});
            const viewer = await ownerGithub.graphql('query { viewer { login } }');
            if (viewer.viewer.login.toLowerCase() !== context.repo.owner.toLowerCase()) throw new Error('Repository owner token required');
            const expected = [
              ['kurumi-lvcha', 'FX战士久留美'],
              ['anbu-nekomoe', '某暗部的少女共栖'],
              ['seitokai-nekomoe', '学生会有洞'],
            ];
            const file = await github.rest.repos.getContent({...context.repo, path: 'config.json', ref: 'main'});
            const config = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
