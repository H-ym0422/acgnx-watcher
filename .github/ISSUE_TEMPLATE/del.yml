name: 删番（手动填写 ID）
description: 推荐从“我的番剧.md”点击删除；此入口兼容原指令
title: "删番 "
body:
  - type: markdown
    attributes:
      value: |
        推荐返回仓库“我的番剧.md”，点击对应行的“删除”，在确认页勾选后提交。
        使用此手动入口时，把标题改为“删番 唯一规则ID”。
        请勿重复填写“删除”“帮我删除”等操作词。相同番名有多条规则时必须指定 ID。
  - type: textarea
    id: notes
    attributes:
      label: 备注（可留空）
