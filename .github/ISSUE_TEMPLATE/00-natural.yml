name: 自然语言请求
description: 直接在标题写查询、追番或管理要求，正文可以留空
body:
  - type: markdown
    attributes:
      value: |
        直接改上方标题即可，正文不用填写。

        - 查询：给我找药屋少女的呢喃第三季第三集之后的资源，字幕组为喵萌奶茶屋
        - 追番：帮我追药屋少女的呢喃第三季，从第三集起，字幕组为喵萌奶茶屋
        - 单集：给我找药屋少女的呢喃第三季第三集的资源
        - 区间：给我找药屋少女的呢喃第三季第三至第五集的资源
        - 管理：帮我暂停药屋少女的呢喃第三季 / 帮我恢复药屋少女的呢喃第三季
        - 删除：帮我删除药屋少女的呢喃第三季
        - 列表：我的追番列表

        “之后”“从……起”均包含该集。查询不新增订阅；追番沿用逐集等待 7 天的兜底策略。
        不接受其他字幕组时，在追番标题末尾加“，不兜底”。
  - type: textarea
    id: notes
    attributes:
      label: 补充说明（可留空）
      description: 操作条件请写在标题；这里仅供备注，不作为解析参数。
    validations:
      required: false
