name: 未读 / 已读
description: 看看哪些推送还没确认看到，或者确认已经看到了
title: "未读"
body:
  - type: markdown
    attributes:
      value: |
        标题留「未读」就会列出**推送了但你还没确认看到**的消息。

        确认看到了，把标题改成 **已读**（或 **已读 番名**，只清那一部）。

        ### 这个功能是干嘛的
        兜住「发出去但人没看到」的情况 —— 手机关流量、飞书被系统杀掉、
        消息静默失败、或者压根没注意到提醒。

        ⚠️ 不是「番看完没」，是「消息看到没」。

        ### 怎么用
        1. 收到新番推送，看一眼
        2. 发一个标题是 `已读` 的 Issue
        3. 以后就不会再提醒你了

        ### 提醒节奏（可改，在 config.json 的 settings 里）
        | 参数 | 默认 | 含义 |
        |---|---|---|
        | `unread_remind_after_minutes` | 60 | 推了多久才开始提醒 |
        | `unread_remind_every_minutes` | 240 | 之后隔多久提醒一次 |
        | `unread_max_nudges` | 6 | 最多提醒几次就不打扰了 |

        ### 为什么不能自动判定已读
        飞书的「已读回执」只对**企业自建应用**开放（`im.message.message_read_v1`），
        自定义机器人 webhook 是单向的，飞书不会告诉它「这条被读了」。
        所以只能你手动确认这一下。