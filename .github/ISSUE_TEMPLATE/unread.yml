name: 未读 / 已读
description: 看看还有哪些集没标记已读，或者把已看完的清掉
title: "未读"
body:
  - type: markdown
    attributes:
      value: |
        标题保留「未读」就会列出还没标记已读的集数。

        想清空，把标题改成 **已读**（或 **已读 番名**，只清那一部）。

        怎么用：
        1. 收到新番推送，去下载、看完
        2. 发一个标题是 `已读` 的 Issue
        3. 列表就清空了

        如果超过 6 小时没确认，最迟每 12 小时会收到一次催办（最多催 4 次就不催了）。